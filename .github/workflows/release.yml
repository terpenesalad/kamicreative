name: Release

# Run from the Actions tab: Release → Run workflow → enter the tag (e.g. v1.2.0).
# Builds the Windows installer on a Windows runner and publishes it as a GitHub release,
# creating the tag on the current commit of the selected branch if it does not exist yet.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must match the version in package.json, e.g. v1.2.0)
        required: true
        default: v1.2.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KamiCreative ${{ inputs.tag }}
          body_path: .github/release-notes/${{ inputs.tag }}.md
          make_latest: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
